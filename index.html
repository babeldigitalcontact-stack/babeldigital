<style>
  html, body { margin:0; padding:0; background:#F4F2EC; }
  *{ box-sizing:border-box; }
  :root{
    --paper:#F4F2EC; --paper-2:#EBE8DF; --ink:#1B1D23; --ink-soft:#5B5F6B; --line:#D9D5C9;
    --cyan:#0E7C7B; --cyan-soft:#DCEEED; --magenta:#B23A63; --magenta-soft:#F5DEE6;
    --amber:#B8791A; --amber-soft:#F3E4C9; --green:#3E7A4C; --green-soft:#E1EEE2; --white:#FFFDF9;
  }
  .gp{ font-family: Inter, "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--paper); min-height:100vh; }
  .gp-mono{ font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .gp-display{ font-family: "Archivo Black", Inter, sans-serif; letter-spacing:-0.01em; }
  .gp-card{ background:var(--white); border:1px solid var(--line); border-radius:2px; }
  .gp-btn{ display:inline-flex; align-items:center; gap:6px; border-radius:2px; font-weight:600; font-size:13px; padding:8px 14px; transition:opacity .15s ease; cursor:pointer; border:1px solid transparent; }
  .gp-btn:active{ opacity:.75; }
  .gp-btn-primary{ background:var(--ink); color:var(--paper); }
  .gp-btn-primary:hover{ background:#000; }
  .gp-btn-outline{ background:transparent; color:var(--ink); border-color:var(--line); }
  .gp-btn-outline:hover{ background:var(--paper-2); }
  .gp-btn-danger{ background:transparent; color:var(--magenta); border-color:var(--magenta-soft); }
  .gp-btn-danger:hover{ background:var(--magenta-soft); }
  .gp-input{ width:100%; border:1px solid var(--line); background:var(--white); border-radius:2px; padding:8px 10px; font-size:13px; color:var(--ink); font-family:inherit; }
  .gp-input:focus{ outline:2px solid var(--cyan); outline-offset:0; border-color:var(--cyan); }
  .gp-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .gp-tab{ display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:2px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft); }
  .gp-tab.active{ background:var(--ink); color:var(--paper); }
  .gp-tab:not(.active):hover{ background:var(--paper-2); color:var(--ink); }
  .gp-badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:2px; white-space:nowrap; }
  .gp-reg{ position:relative; }
  .gp-reg::before{ content:""; position:absolute; width:10px; height:10px; border:1.5px solid var(--ink); border-radius:50%; }
  .gp-reg::after{ content:""; position:absolute; width:1px; height:14px; background:var(--ink); left:5px; top:-2px; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  @keyframes gp-spin{ to{ transform:rotate(360deg); } }
  .spin{ animation:gp-spin 1s linear infinite; }
  @media (max-width: 720px){
    .gp-grid-2{ grid-template-columns: 1fr !important; }
  }
</style>

/* ---------------- paramètres de l'atelier (émetteur des devis/factures) ---------------- */
const DEFAULT_SETTINGS = {
  shopName: "",
  phone: "",
  address: "",
  trade: "",
  rccm: "",
  ninea: "",
  footerNote: "",
  onboarded: false
};
const loadSettings = () => {
  try {
    const raw = window.localStorage.getItem("grafipro:settings");
    if (raw) return {
      ...DEFAULT_SETTINGS,
      ...JSON.parse(raw)
    };
  } catch (e) {}
  return DEFAULT_SETTINGS;
};
const saveSettings = s => {
  try {
    window.localStorage.setItem("grafipro:settings", JSON.stringify(s));
  } catch (e) {}
};

/* ---------------- génération PDF devis / facture ---------------- */
const hexToRgb = hex => {
  const h = (hex || "#1B1D23").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
};
function generatePDF(project, client, settings, kind /* "devis" | "facture" */) {
  const {
    jsPDF
  } = window.jspdf;
  const doc = new jsPDF({
    unit: "mm",
    format: "a4"
  });
  const t = projectTotals(project);
  const trade = tradeInfo(settings.trade);
  const accent = hexToRgb(trade ? trade.accent : "#1B1D23");
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 15;
  let y = 18;

  /* ---- bandeau d'en-tête : couleur = accent du métier ---- */
  doc.setFillColor(...accent);
  doc.rect(0, 0, pageW, 34, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(17);
  doc.text(settings.shopName || "Atelier", marginX, 14);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8.5);
  doc.text(trade ? trade.label : "Atelier de création", marginX, 19.5);
  doc.setFontSize(8.5);
  let contactY = 26;
  const contactBits = [settings.address, settings.phone ? "Tél : " + settings.phone : ""].filter(Boolean);
  contactBits.forEach(line => {
    doc.text(line, marginX, contactY);
    contactY += 4.2;
  });
  doc.setFontSize(20);
  doc.setFont("helvetica", "bold");
  doc.text(kind === "facture" ? "FACTURE" : "DEVIS", pageW - marginX, 16, {
    align: "right"
  });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(`N° ${project.id.toUpperCase()}`, pageW - marginX, 22, {
    align: "right"
  });
  doc.text(`Date : ${today()}`, pageW - marginX, 27, {
    align: "right"
  });
  if (project.deadline) doc.text(`Échéance : ${project.deadline}`, pageW - marginX, 32, {
    align: "right"
  });

  y = 46;
  doc.setTextColor(20, 20, 20);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10.5);
  doc.text(kind === "facture" ? "FACTURÉ À" : "DEVIS POUR", marginX, y);
  doc.setDrawColor(...accent);
  doc.setLineWidth(0.6);
  doc.line(marginX, y + 1.5, marginX + 22, y + 1.5);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  y += 7;
  doc.setFont("helvetica", "bold");
  doc.text(client?.name || "—", marginX, y);
  doc.setFont("helvetica", "normal");
  if (client?.phone) {
    y += 5;
    doc.text(client.phone, marginX, y);
  }
  if (client?.email) {
    y += 5;
    doc.text(client.email, marginX, y);
  }
  if (client?.address) {
    y += 5;
    doc.text(client.address, marginX, y);
  }

  y += 12;
  doc.setFillColor(...accent);
  doc.rect(marginX, y - 5, 3, 5, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(20, 20, 20);
  doc.text(project.title || "Projet", marginX + 6, y);
  if (project.category) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(110, 110, 110);
    doc.text(project.category, marginX + 6, y + 5);
    y += 5;
  }
  y += 3;
  const rows = (project.lineItems || []).map(li => [li.desc || "—", String(li.qty || 0), fcfa(li.unitPrice), fcfa((Number(li.qty) || 0) * (Number(li.unitPrice) || 0))]);
  doc.autoTable({
    startY: y + 4,
    head: [["Description", "Qté", "P.U.", "Total"]],
    body: rows,
    theme: "grid",
    headStyles: {
      fillColor: accent,
      textColor: 255,
      fontStyle: "bold",
      fontSize: 9.5
    },
    alternateRowStyles: {
      fillColor: [248, 247, 243]
    },
    styles: {
      fontSize: 9.5,
      cellPadding: 3.2,
      lineColor: [225, 221, 210],
      lineWidth: 0.2
    },
    columnStyles: {
      1: {
        halign: "right",
        cellWidth: 20
      },
      2: {
        halign: "right",
        cellWidth: 35
      },
      3: {
        halign: "right",
        cellWidth: 35
      }
    },
    margin: {
      left: marginX,
      right: marginX
    }
  });
  let finalY = doc.lastAutoTable.finalY + 8;
  const line = (label, value, bold, big) => {
    doc.setFont("helvetica", bold ? "bold" : "normal");
    doc.setFontSize(big ? 13 : bold ? 11 : 10);
    doc.setTextColor(...(big ? accent : [40, 40, 40]));
    doc.text(label, pageW - 78, finalY);
    doc.text(value, pageW - marginX, finalY, {
      align: "right"
    });
    finalY += big ? 8 : 6;
  };
  doc.setTextColor(40, 40, 40);
  line("Sous-total", fcfa(t.subtotal));
  if (project.discount > 0) line("Remise", "- " + fcfa(project.discount));
  finalY += 1;
  doc.setDrawColor(...accent);
  doc.setLineWidth(0.4);
  doc.line(pageW - 78, finalY - 4, pageW - marginX, finalY - 4);
  line("TOTAL " + (kind === "facture" ? "FACTURE" : "DEVIS"), fcfa(t.total), true, true);
  if (kind === "facture") {
    doc.setTextColor(40, 40, 40);
    line("Déjà payé", fcfa(t.paid));
    line(t.due > 0 ? "Reste à payer" : "Solde", fcfa(t.due), true, t.due > 0);
  }
  finalY += 5;

  /* ---- mention automatique si aucune note personnalisée n'est définie ---- */
  const autoNote = kind === "facture" ? t.due > 0 ? `Merci d'effectuer le règlement du solde (${fcfa(t.due)}) selon les modalités convenues.` : "Facture soldée. Merci de votre confiance." : "Ce devis est valable 15 jours à compter de sa date d'émission. Un acompte peut être demandé au démarrage de la production.";
  const noteText = settings.footerNote || autoNote;
  doc.setFillColor(...(trade ? hexToRgb(trade.accentSoft) : [235, 232, 223]));
  const noteLines = doc.splitTextToSize(noteText, pageW - marginX * 2 - 8);
  const noteBoxH = noteLines.length * 4.2 + 6;
  doc.rect(marginX, finalY, pageW - marginX * 2, noteBoxH, "F");
  doc.setFont("helvetica", "italic");
  doc.setFontSize(8.5);
  doc.setTextColor(60, 60, 60);
  doc.text(noteLines, marginX + 4, finalY + 5.5);
  finalY += noteBoxH + 6;

  const pageH = doc.internal.pageSize.getHeight();
  doc.setDrawColor(217, 213, 201);
  doc.setLineWidth(0.2);
  doc.line(marginX, pageH - 16, pageW - marginX, pageH - 16);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7.5);
  doc.setTextColor(120, 120, 120);
  const legalBits = [settings.rccm ? "RCCM " + settings.rccm : "", settings.ninea ? "NINEA " + settings.ninea : ""].filter(Boolean).join("  ·  ");
  if (legalBits) doc.text(legalBits, marginX, pageH - 11);
  doc.text(`Document généré via GrafiPro — développé par ${BABEL_DIGITAL.name} (${BABEL_DIGITAL.phones.join(" / ")})`, marginX, pageH - 6.5);
  return doc;
}
function projectTotals(p) {
  const subtotal = (p.lineItems || []).reduce((s, li) => s + (Number(li.qty) || 0) * (Number(li.unitPrice) || 0), 0);
  const total = Math.max(0, subtotal - (Number(p.discount) || 0));
  const paid = (p.payments || []).reduce((s, pay) => s + (Number(pay.amount) || 0), 0);
